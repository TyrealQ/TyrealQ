<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Profile README Preview</title>
<style>
:root { --bg:#ffffff; --fg:#1f2328; --muted:#59636e; --border:#d1d9e0; --link:#0969da; --chip:#f6f8fa; }
:root[data-theme="dark"] { --bg:#0d1117; --fg:#f0f6fc; --muted:#9198a1; --border:#3d444d; --link:#4493f8; --chip:#151b23; }
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
.bar { position:sticky; top:0; z-index:1; display:flex; gap:16px; align-items:center; padding:10px 16px; border-bottom:1px solid var(--border); background:var(--chip); }
.bar b { font-weight:600; }
.seg { display:inline-flex; border:1px solid var(--border); border-radius:6px; overflow:hidden; }
.seg button { border:0; background:transparent; color:var(--fg); padding:4px 12px; font:inherit; cursor:pointer; }
.seg button + button { border-left:1px solid var(--border); }
.seg button[aria-pressed="true"] { background:var(--link); color:#fff; }
.page { max-width:1280px; margin:0 auto; padding:24px 16px; display:grid; grid-template-columns:296px 1fr; gap:24px; }
.side img { width:100%; aspect-ratio:1; object-fit:cover; border-radius:50%; border:1px solid var(--border); background:#fff; }
.side h1 { margin:16px 0 0; font-size:24px; line-height:1.25; }
.side p { margin:0; color:var(--muted); font-size:20px; font-weight:300; }
.readme { border:1px solid var(--border); border-radius:6px; padding:24px; min-width:0; }
.readme .path { font-size:12px; color:var(--muted); margin:-8px 0 16px; }
.readme img.card { display:block; width:100%; height:auto; }
.links { text-align:center; margin:16px 0 0; }
.links a { color:var(--link); text-decoration:none; }
.links a:hover { text-decoration:underline; }
@media (max-width: 768px) { .page { grid-template-columns:1fr; } .side img { width:96px; } }
</style>
</head>
<body>
<div class="bar">
  <span><b>Theme</b> <span class="seg" id="theme"><button data-v="light">Light</button><button data-v="dark">Dark</button></span></span>
</div>
<div class="page">
  <aside class="side">
    <img src="https://github.com/TyrealQ.png" alt="">
    <h1>Yizhou (Tyreal) Qian</h1>
    <p>TyrealQ</p>
  </aside>
  <main class="readme">
    <div class="path">TyrealQ / README.md</div>
    <img class="card" id="card" alt="Profile card">
    <p class="links">
      <a href="https://tyrealq.github.io">Website</a> ·
      <a href="https://scholar.google.com/citations?user=1FtSN0gAAAAJ&hl=en">Google Scholar</a> ·
      <a href="https://youtube.com/@tyrealq">YouTube</a>
    </p>
  </main>
</div>
<script>
(function () {
  var theme = "light";
  try { theme = localStorage.getItem("pv-theme") || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"); } catch (e) {}
  function draw() {
    document.documentElement.setAttribute("data-theme", theme);
    document.getElementById("card").src = "../card-" + theme + ".svg?" + Date.now();
    document.querySelectorAll("#theme button").forEach(function (b) { b.setAttribute("aria-pressed", String(b.dataset.v === theme)); });
    try { localStorage.setItem("pv-theme", theme); } catch (e) {}
  }
  document.getElementById("theme").addEventListener("click", function (e) {
    if (e.target.dataset.v) { theme = e.target.dataset.v; draw(); }
  });
  draw();
})();
</script>
</body>
</html>
